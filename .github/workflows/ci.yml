name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow only reads the repo.
permissions:
  contents: read

# A newer push to the same branch/PR makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to commit SHAs (the trailing comment is the tag); Dependabot
# keeps both in step.

# Windows only: fsbrowse and procutil call golang.org/x/sys/windows directly.
jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: web/package.json

      - name: Cache bun packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~\.bun\install\cache
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Frontend install
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Frontend test
        working-directory: web
        run: bun run test

      # tsc --noEmit + vite build; output lands in internal/webui/dist for go:embed
      - name: Frontend build
        working-directory: web
        run: bun run build

      - name: gofmt
        run: |
          $unformatted = gofmt -l .
          if ($unformatted) {
            Write-Host "Not gofmt-formatted:`n$unformatted"
            exit 1
          }

      - name: go.mod is tidy
        run: go mod tidy -diff

      - name: go vet
        run: go vet ./...

      - name: go test (race detector needs cgo; windows-latest ships gcc)
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...

      - name: go build
        run: go build -trimpath -ldflags "-s -w -X main.version=${{ github.sha }}" -o faster-whisper-gui.exe ./cmd/server

      - name: Upload the built exe
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: faster-whisper-gui-windows
          path: faster-whisper-gui.exe
          retention-days: 7
          if-no-files-found: error
